


<!-- Footer Actions -->

<footer class="page-footer">
  <div id="footerButtons"></div>
</footer>



<!-- PMH Modal -->

<div
  class="modal fade"
  id="pmhModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Past Medical History
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>

      </div>

      <div class="modal-body">

        <p class="mb-0">
          No past medical history available.
        </p>

      </div>

    </div>
  </div>
</div>


<!-- Visit Modal -->

<div
  class="modal fade"
  id="visitModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Visit Information
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>

      </div>

      <div class="modal-body">
        Visit details can be viewed here.
      </div>

    </div>
  </div>
</div>


<!-- Order Set Modal -->

<div
  class="modal fade"
  id="orderModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Order Set
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>

      </div>

      <div class="modal-body">

        <select class="form-select">

          <option selected>
            Select an order set
          </option>

          <option>
            Routine Prescription Set
          </option>

          <option>
            Follow-up Set
          </option>

        </select>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-primary"
          data-bs-dismiss="modal"
        >
          Apply
        </button>

      </div>

    </div>
  </div>
</div>


<!-- Dispense Modal -->

<div
  class="modal fade"
  id="dispenseModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Dispense
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>

      </div>

      <div class="modal-body">
        Dispensing workflow opened successfully.
      </div>

    </div>
  </div>
</div>


<!-- Save Toast -->

<div
  class="toast-container position-fixed bottom-0 end-0 p-3"
>
  <div
    id="appToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >

    <div class="toast-header">

      <i
        class="fa-solid fa-circle-check text-success me-2"
      ></i>

      <strong class="me-auto">
        Success
      </strong>

      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>

    </div>

    <div class="toast-body">
      Changes saved successfully.
    </div>

  </div>
</div>
