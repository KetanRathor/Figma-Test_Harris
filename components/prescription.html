<section class="prescription-section">

  <!-- Toolbar -->

  <div class="section-toolbar">

    <div class="section-title-actions">

      <strong>
        Current Prescriptions
      </strong>

      <div id="prescriptionActions"></div>

    </div>


    <!-- Tabs -->

    <div
      class="nav nav-pills small-tabs"
      id="prescriptionTabs"
      role="tablist"
    ></div>

  </div>


  <!-- Tab Content -->

  <div class="tab-content">

    <!-- Past RX -->

    <div
      class="tab-pane fade show active"
      id="pastRx"
      role="tabpanel"
    >

      <div id="prescriptionTable"></div>

    </div>


    <!-- Medication History -->

    <div
      class="tab-pane fade"
      id="medHist"
      role="tabpanel"
    >

      <div class="history-panel">

        <i class="fa-solid fa-clock-rotate-left"></i>

        <strong>
          Medication History
        </strong>

        <p class="mb-0">
          Historical medications will appear here.
        </p>

      </div>

    </div>

  </div>

</section>
